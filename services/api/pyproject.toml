[project]
name = "trading-api"
version = "0.1.0"
description = "FastAPI service for the Trading Research Workspace (owns every write; streams chat/progress over SSE)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-core",
    "fastapi>=0.118",
    "uvicorn[standard]>=0.35",
    "pydantic-settings>=2.10",
    "sqlalchemy[asyncio]>=2.0.40",
    "asyncpg>=0.30",
    "pyjwt>=2.10",
]

[project.scripts]
trading-api = "trading_api.cli:main"

[tool.uv.sources]
trading-core = { workspace = true }

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading_api"]
