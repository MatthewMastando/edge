futures_contracts:
  # Euro FX Dec 2026. Physically delivered on the third Wednesday (2026-12-16);
  # trading terminates two business days before delivery (2026-12-14, 09:16 CT).
  - contract_code: "6EZ6"
    root: "6E"
    exchange: CME
    contract_month: "2026-12"
    expiry_date: 2026-12-16
    last_trade_date: 2026-12-14
    first_notice_date: null
    tick_size: "0.00005"
    tick_value: "6.25"
    point_multiplier: "125000"
    currency: USD
    session_calendar_id: cme_globex_fx
    settlement_type: physical
    settlement_time_local: "14:00:00"

  # Gold Dec 2026. Physically delivered; last trade is the third-last business day of the
  # delivery month (2026-12-29); first notice day is the last business day before it (2026-11-30).
  - contract_code: "GCZ6"
    root: "GC"
    exchange: COMEX
    contract_month: "2026-12"
    expiry_date: 2026-12-29
    last_trade_date: 2026-12-29
    first_notice_date: 2026-11-30
    tick_size: "0.10"
    tick_value: "10.00"
    point_multiplier: "100"
    currency: USD
    session_calendar_id: comex_globex_metals
    settlement_type: physical
    settlement_time_local: "12:30:00"

  # WTI Crude Nov 2026. Trading terminates three business days before the 25th calendar day of
  # the month prior to delivery (25 Oct 2026 is a Sunday -> 23 Oct -> 2026-10-20).
  - contract_code: "CLX6"
    root: "CL"
    exchange: NYMEX
    contract_month: "2026-11"
    expiry_date: 2026-10-20
    last_trade_date: 2026-10-20
    first_notice_date: null
    tick_size: "0.01"
    tick_value: "10.00"
    point_multiplier: "1000"
    currency: USD
    session_calendar_id: nymex_globex_energy
    settlement_type: physical
    settlement_time_local: "13:30:00"

  # E-mini S&P 500 Dec 2026. Cash settled to the special opening quotation on the third Friday
  # (2026-12-18); trading terminates 08:30 CT that day.
  - contract_code: "ESZ6"
    root: "ES"
    exchange: CME
    contract_month: "2026-12"
    expiry_date: 2026-12-18
    last_trade_date: 2026-12-18
    first_notice_date: null
    tick_size: "0.25"
    tick_value: "12.50"
    point_multiplier: "50"
    currency: USD
    session_calendar_id: cme_globex_equity_index
    settlement_type: cash
    settlement_time_local: "15:00:00"

# Example roll entries for continuous-series handling. The generator does not produce the prior
# contracts; these exist so Stage 1A can test roll-window exclusion against real-shaped data.
roll_maps:
  - root: "6E"
    from_contract_code: "6EU6"
    to_contract_code: "6EZ6"
    roll_date: 2026-09-14
    method: back_adjust_difference
    adjustment: "0.00265"
  - root: "ES"
    from_contract_code: "ESU6"
    to_contract_code: "ESZ6"
    roll_date: 2026-09-17
    method: back_adjust_difference
    adjustment: "58.75"
