# Fixture instruments. Contract metadata mirrors the real listed specifications so that the
# fixture path exercises the same tick/multiplier/session logic as live data will.
# Everything generated from this file is labeled provenance=fixture.
#
# `fixture:` holds generator-only parameters (starting price, per-trade volatility in ticks,
# expected trades per 5-minute bar, size distribution). They are not part of the domain model.

instruments:
  - symbol: "6E"
    name: "Euro FX Futures"
    asset_class: futures
    venue: CME
    currency: USD
    tick_size: "0.00005"
    tick_value: "6.25"
    multiplier: "125000"
    session_calendar_id: cme_globex_fx
    fixture:
      start_price: "1.17250"
      step_ticks_sd: 1.1
      trades_per_bar: 9
      size_min: 1
      size_max: 12
      size_decimals: 0

