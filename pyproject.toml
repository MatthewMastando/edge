[project]
name = "trading-research-workspace"
version = "0.1.0"
description = "Trading Research Workspace monorepo (uv workspace root)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "trading-core",
    "trading-api",
    "trading-worker",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/trading_core", "services/api", "services/worker"]

[tool.uv.sources]
trading-core = { workspace = true }
trading-api = { workspace = true }
trading-worker = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.14",
    "mypy>=1.19",
    "pytest>=9",
    "pytest-asyncio>=1.3",
    "httpx>=0.28",
    "psycopg[binary]>=3.3",
    "pyarrow-stubs>=20",
    "types-pyyaml>=6",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/trading_core", "services/api", "services/worker", "tests", "scripts"]
extend-exclude = ["apps", "node_modules", ".venv"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "N",        # pep8-naming
    "ANN",      # annotations
    "ASYNC",    # async pitfalls
    "S",        # bandit (security)
    "RUF",      # ruff-specific
    "PL",       # pylint subset
    "TCH",      # type-checking imports
    "SIM",      # simplify
    "PTH",      # pathlib
    "DTZ",      # timezone-aware datetimes
]
ignore = [
    "PLR0913",  # too many arguments: domain models and generators legitimately take many
    "PLR0917",  # too many positional arguments: FastAPI route signatures
    "PLR2004",  # magic values in tests/generator constants
    "S101",     # asserts are fine in tests and invariants
    "ANN401",   # Any is explicitly disallowed by mypy strict; ruff duplicate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR", "ANN", "DTZ"]
"scripts/**" = ["S603", "S607"]
# FastAPI resolves annotations at import time for dependency injection.
"services/api/trading_api/**" = ["TC001", "TC002", "TC003"]

[tool.ruff.lint.flake8-type-checking]
# Pydantic evaluates annotations at import time; never move their imports behind TYPE_CHECKING.
runtime-evaluated-base-classes = ["pydantic.BaseModel", "trading_core.domain.common.DomainModel"]
runtime-evaluated-decorators = ["pydantic.validate_call"]

[tool.ruff.lint.isort]
known-first-party = ["trading_core", "trading_api", "trading_worker"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_generics = true
disallow_untyped_decorators = true
no_implicit_reexport = true
enable_error_code = ["ignore-without-code", "redundant-expr", "truthy-bool"]
plugins = ["pydantic.mypy"]
files = ["packages/trading_core", "services/api", "services/worker", "tests", "scripts"]
exclude = ["node_modules", "\\.venv"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "postgres: requires DATABASE_URL pointing at a disposable Postgres (skipped otherwise)",
]
filterwarnings = ["error::DeprecationWarning:trading_core.*"]
